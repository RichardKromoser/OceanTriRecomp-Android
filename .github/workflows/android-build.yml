name: Android ARM64 build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MH3 for Android (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.31.6'
          ninjaVersion: '1.12.1'

      - name: Build translator CLI
        run: dotnet build toolchain/translator/src/Translator.Cli/Translator.Cli.csproj --configuration Release

      - name: Configure Android build
        run: |
          cmake -S runtime -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Compile native Android library
        run: cmake --build build-android --target MH3 --parallel 2

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: mh3-android-arm64-native
          path: build-android/libmain.so
          if-no-files-found: error
          retention-days: 14
